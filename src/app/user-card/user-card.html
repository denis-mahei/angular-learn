<section>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <input type="text" formControlName="name" class="border">
    <input type="email" formControlName="email" class="border">
    <button type="submit" [disabled]="!loginForm.value">Add user</button>
  </form>
  <div>

    @for (user of users(); track user.id) {
      <div>
        <p>Name: {{ user.name }}</p>
        <p>Email:{{ user.email }}</p>
        <button type="button" (click)="deleteUser(user.id)">delete</button>
      </div>
    } @empty {
      <p>No users found!</p>
    }
  </div>
  @if (usersLength()) {
    <p>Quantity user: {{usersLength()}}</p>
  }
</section>
